<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Button</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body {
            font-family: system-ui, -apple-system, sans-serif;
        }
    </style>
</head>
<body class="bg-gray-100 flex items-center justify-center min-h-screen m-0 p-0">

    <button 
        id="clickBtn"
        onclick="sendMessage()"
        class="px-6 py-3 bg-blue-600 hover:bg-blue-700 active:bg-blue-800 text-white font-medium text-base rounded-md transition-colors duration-150 disabled:opacity-50">
        Click Me
    </button>

    <script type="module">
    const DISCORD_WEBHOOK_URL = import.meta.env.VITE_DISCORD_WEBHOOK_URL;
    const DISCORD_USER_ID = import.meta.env.VITE_DISCORD_USER_ID;

    async function sendMessage() {
        if (!DISCORD_WEBHOOK_URL) {
            console.error("Missing Webhook URL");
            return;
        }

        const payload = {
            content: `Button is clicked <@${DISCORD_USER_ID}>`
        };

        await fetch(DISCORD_WEBHOOK_URL, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(payload)
        });
    }
</script>
</body>
</html>
