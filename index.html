<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>LED Controller</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-900 text-white min-h-screen flex flex-col items-center justify-center p-4">

    <div id="status" class="mb-4 text-yellow-400 font-mono text-sm">Status: Ready</div>

    <div class="grid grid-cols-2 gap-4 max-w-xs w-full">
        <button onclick="sendPin(1)" class="py-6 rounded-lg font-bold bg-yellow-500 text-black">GPIO 2 (1)</button>
        <button onclick="sendPin(2)" class="py-6 rounded-lg font-bold bg-red-600 text-white">GPIO 4 (2)</button>
        <button onclick="sendPin(3)" class="py-6 rounded-lg font-bold bg-green-600 text-white">GPIO 5 (3)</button>
        <button onclick="sendPin(4)" class="py-6 rounded-lg font-bold bg-blue-600 text-white">GPIO 21 (4)</button>
    </div>

    <script>
        const AIO_USERNAME = "YOUR_AIO_USERNAME";
        const AIO_KEY = "YOUR_AIO_KEY";

        function log(msg) {
            document.getElementById("status").innerText = "Status: " + msg;
        }

        async function sendPin(num) {
            log("Sending " + num + "...");
            try {
                const res = await fetch(`https://io.adafruit.com/api/v2/${AIO_USERNAME}/feeds/led-control/data`, {
                    method: 'POST',
                    headers: {
                        'X-AIO-Key': AIO_KEY,
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ value: num.toString() })
                });
                if (res.ok) {
                    log("Sent " + num + " successfully!");
                } else {
                    log("Error code: " + res.status);
                }
            } catch (e) {
                log("Network Failed: " + e.message);
            }
        }
    </script>
</body>
</html>
