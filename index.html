<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LED Controller</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-900 text-white min-h-screen flex items-center justify-center p-4">
    <div class="grid grid-cols-2 gap-4 max-w-xs w-full">
        <button onclick="togglePin(2)" class="py-6 rounded-lg font-bold shadow-lg transition-transform active:scale-95 bg-yellow-500 hover:bg-yellow-600 text-black">GPIO 2</button>
        <button onclick="togglePin(4)" class="py-6 rounded-lg font-bold shadow-lg transition-transform active:scale-95 bg-red-600 hover:bg-red-700 text-white">GPIO 4</button>
        <button onclick="togglePin(5)" class="py-6 rounded-lg font-bold shadow-lg transition-transform active:scale-95 bg-green-600 hover:bg-green-700 text-white">GPIO 5</button>
        <button onclick="togglePin(21)" class="py-6 rounded-lg font-bold shadow-lg transition-transform active:scale-95 bg-blue-600 hover:bg-blue-700 text-white">GPIO 21</button>
    </div>

    <script>
        const ESP32_IP = "192.168.1.100";

        async function togglePin(pin) {
            try {
                await fetch(`http://${ESP32_IP}/toggle?pin=${pin}`, { method: 'POST', mode: 'no-cors' });
            } catch (e) {}
        }
    </script>
</body>
</html>
