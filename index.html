<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LED Controller</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-900 text-white min-h-screen flex items-center justify-center p-4">
    <div class="grid grid-cols-2 gap-4 max-w-xs w-full">
        <button onclick="sendPin(1)" class="py-6 rounded-lg font-bold shadow-lg transition-transform active:scale-95 bg-yellow-500 hover:bg-yellow-600 text-black">GPIO 2 (1)</button>
        <button onclick="sendPin(2)" class="py-6 rounded-lg font-bold shadow-lg transition-transform active:scale-95 bg-red-600 hover:bg-red-700 text-white">GPIO 4 (2)</button>
        <button onclick="sendPin(3)" class="py-6 rounded-lg font-bold shadow-lg transition-transform active:scale-95 bg-green-600 hover:bg-green-700 text-white">GPIO 5 (3)</button>
        <button onclick="sendPin(4)" class="py-6 rounded-lg font-bold shadow-lg transition-transform active:scale-95 bg-blue-600 hover:bg-blue-700 text-white">GPIO 21 (4)</button>
    </div>

    <script>
        const AIO_USERNAME = "miccerr";
        const AIO_KEY = "aio_eMmW41DS67og8wT53RWE9fTWtXBI";

        async function sendPin(num) {
            console.log("Sending value:", num);
            try {
                const response = await fetch(`https://io.adafruit.com/api/v2/${AIO_USERNAME}/feeds/led-control/data`, {
                    method: 'POST',
                    headers: {
                        'X-AIO-Key': AIO_KEY,
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ value: num.toString() })
                });
                if (response.ok) {
                    console.log("Sent successfully!");
                } else {
                    console.error("HTTP Error:", response.status);
                }
            } catch (e) {
                console.error("Network Error:", e);
            }
        }
    </script>
</body>
</html>
