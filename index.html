<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Adafruit IO Feeds</title>
  <style>
    body {
      font-family: sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 15px;
      padding-top: 40px;
    }
    .config {
      display: flex;
      flex-direction: column;
      gap: 8px;
      width: 250px;
    }
    .config input {
      padding: 8px;
    }
    .buttons {
      display: flex;
      gap: 10px;
    }
    button {
      padding: 12px 20px;
      font-size: 16px;
      cursor: pointer;
    }
    #status {
      font-weight: bold;
    }
  </style>
</head>
<body>

  <div class="config">
    <input type="text" id="username" placeholder="Adafruit Username">
    <input type="password" id="aioKey" placeholder="Adafruit AIO Key">
    <input type="text" id="feedKey" placeholder="Feed Key (e.g. my-feed)">
  </div>

  <div class="buttons">
    <button onclick="sendData(1)">1</button>
    <button onclick="sendData(2)">2</button>
    <button onclick="sendData(3)">3</button>
    <button onclick="sendData(4)">4</button>
  </div>

  <div id="status"></div>

  <script>
    async function sendData(val) {
      const username = document.getElementById('username').value.trim();
      const aioKey = document.getElementById('aioKey').value.trim();
      const feedKey = document.getElementById('feedKey').value.trim();
      const statusDiv = document.getElementById('status');

      if (!username || !aioKey || !feedKey) {
        statusDiv.textContent = 'Please fill in Username, AIO Key, and Feed Key.';
        return;
      }

      statusDiv.textContent = 'Sending...';

      const url = `https://io.adafruit.com/api/v2/${username}/feeds/${feedKey}/data`;

      try {
        const response = await fetch(url, {
          method: 'POST',
          headers: {
            'X-AIO-Key': aioKey,
            'Content-Type': 'application/json'
          },
          body: JSON.stringify({ value: val })
        });

        if (response.ok) {
          const resData = await response.json();
          statusDiv.textContent = `Sent: ${val} (Response ID: ${resData.id})`;
        } else {
          statusDiv.textContent = `Error: ${response.status} ${response.statusText}`;
        }
      } catch (err) {
        statusDiv.textContent = `Request failed: ${err.message}`;
      }
    }
  </script>

</body>
</html>
